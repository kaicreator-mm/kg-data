    printed_page_label: "52"
    locator: "text/1-XMC-sjwyrpWuWn1BJPpirxDEo8LZJvv/p0060.txt#L27-L28"
    quote: "自动变速器最重要的改进是别克公司为坦克开发的液力变矩器。1948年，这种液力变矩器与其他部件结合成为液力变速器，而最后成为各种自动变速器。"
  - evidence_id: book:1-XMC-sjwyrpWuWn1BJPpirxDEo8LZJvv:ev:p0060:e06
    kind: TEXT
    pdf_page_index: 60
    printed_page_label: "52"
    locator: "text/1-XMC-sjwyrpWuWn1BJPpirxDEo8LZJvv/p0060.txt#L29-L31"
    quote: "液力变矩器是连接发动机飞轮和变速器输入轴的另一种液力传动装置……允许发动机与变速器之间有些滑转，从而在停车时，不脱开动力档也能维持发动机运转。"
