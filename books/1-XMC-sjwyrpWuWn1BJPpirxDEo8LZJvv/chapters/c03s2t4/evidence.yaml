    locator: "text/1-XMC-sjwyrpWuWn1BJPpirxDEo8LZJvv/p0065.txt#L11-L18"
    quote: "随着车速逐渐提高，来自涡轮的液体逐渐偏离作用在导轮叶片前表面的方向……经导轮反射的液体返回给泵轮，反而成了泵轮旋转的阻力……现代汽车采用的液力变矩器，均在导轮和导轮支撑套之间安装了单向离合器，即综合式液力变矩器。"
  - evidence_id: book:1-XMC-sjwyrpWuWn1BJPpirxDEo8LZJvv:ev:p0065:e03
