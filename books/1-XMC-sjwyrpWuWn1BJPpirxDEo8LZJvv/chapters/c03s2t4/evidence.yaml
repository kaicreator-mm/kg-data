    quote: "液力变矩器是为了改善液力耦合器的性能而在其基础上发展起来的，除了液力耦合器的泵轮、涡轮、导环和壳体以外，液力变矩器在涡轮和泵轮之间增加了双向锁止导轮，液力变矩器的结构如图3-6所示。"
