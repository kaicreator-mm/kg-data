    quote: "常用的单向离合器有两种不同的形式：即滚柱式和楔块式。"
  - evidence_id: book:1-XMC-sjwyrpWuWn1BJPpirxDEo8LZJvv:ev:p0066:e03
    kind: TEXT
    pdf_page_index: 66
    printed_page_label: "58"
    locator: "text/1-XMC-sjwyrpWuWn1BJPpirxDEo8LZJvv/p0066.txt#L11-L15"
    quote: "滚柱式单向离合器……利用弹簧把滚柱固定在离合器内外座圈之间适当位置。外座圈的内表面有若干个凸轮状缺口……滚柱楔紧在缺口滚道的狭窄端，则旋转座圈也锁止……滚柱朝缺口滚道较宽端运动……该座圈能自由转动。"
