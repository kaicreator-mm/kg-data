    quote: "课题三 综合式液力变矩器……不同之处在于综合式液力变矩器的导轮不是完全固定不动的，而是通过单向离合器支承在导轮支撑套上（导轮支撑套固定不动）……使其冲击泵轮叶片的后表面……达到增大转矩的目的。"

