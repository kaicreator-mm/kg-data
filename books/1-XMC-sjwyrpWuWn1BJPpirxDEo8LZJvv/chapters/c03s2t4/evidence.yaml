  # ---------- p0067 (printed 59) ----------
  - evidence_id: book:1-XMC-sjwyrpWuWn1BJPpirxDEo8LZJvv:ev:p0067:e01
    kind: TEXT
    pdf_page_index: 67
    printed_page_label: "59"
    locator: "text/1-XMC-sjwyrpWuWn1BJPpirxDEo8LZJvv/p0067.txt#L3-L5"
    quote: "当其中一个座圈固定，而另一座圈往某一方向旋转时，其结果使S形楔块竖起，楔紧内外座圈表面，则旋转座圈锁止。当该座圈以相反方向旋转，使楔块倒下……该座圈可以自由转动。"
  - evidence_id: book:1-XMC-sjwyrpWuWn1BJPpirxDEo8LZJvv:ev:p0067:e02
    kind: TEXT
    pdf_page_index: 67
    printed_page_label: "59"
    locator: "text/1-XMC-sjwyrpWuWn1BJPpirxDEo8LZJvv/p0067.txt#L6-L8"
    quote: "单向离合器内座圈和外座圈之间放置有若干滚柱或楔块。内座圈与导轮支撑套用键槽连接，而导轮支撑套与变速器油泵盖连接，因为油泵盖固定在变速器壳体上，所以，单向离合器内座圈不能转动。单向离合器的外座圈与导轮连接并同步转动。"
  - evidence_id: book:1-XMC-sjwyrpWuWn1BJPpirxDEo8LZJvv:ev:p0067:e03
    kind: TEXT
    pdf_page_index: 67
    printed_page_label: "59"
    locator: "text/1-XMC-sjwyrpWuWn1BJPpirxDEo8LZJvv/p0067.txt#L9-L18"
    quote: "1. 导轮的作用……导轮的叶片能使工作液流动的方向再次反向……推动泵轮叶片的后表面……来自发动机的转矩与从涡轮回流的转矩合成后传递到涡轮……转矩的增加是通过涡轮转速的降低获得的，否则将破坏能量守恒定律。"
  - evidence_id: book:1-XMC-sjwyrpWuWn1BJPpirxDEo8LZJvv:ev:p0067:e04
    kind: FIGURE
    pdf_page_index: 67
    printed_page_label: "59"
    locator: "renders/1-XMC-sjwyrpWuWn1BJPpirxDEo8LZJvv/pilot-crops-300dpi/p0067_crop0_300dpi.png"
    quote: "图3-14 泵轮的方向和涡轮的旋转 a）无导轮（T/P） b）有导轮（T/R/P，R带固定支撑）"
    notes: "asset=c03s2t4-F67-1; sha256=7e57c23e0fd1309183cf7bd239433dada5ac81937a47c801b1f1271abf616ec3"
  - evidence_id: book:1-XMC-sjwyrpWuWn1BJPpirxDEo8LZJvv:ev:p0067:e05
    kind: TEXT
    pdf_page_index: 67
    printed_page_label: "59"
    locator: "text/1-XMC-sjwyrpWuWn1BJPpirxDEo8LZJvv/p0067.txt#L26-L35"
    quote: "2. 单向离合器的作用 从涡轮回流到导轮的工作液方向取决于泵轮和涡轮之间的转速差。……转速差大时……导轮被单向离合器锁住而不能旋转……当涡轮的转速接近于泵轮的转速时……单向离合器使导轮处于自由状态，使工作液回流到泵轮。"

  # ---------- p0068 (printed 60) ----------
  - evidence_id: book:1-XMC-sjwyrpWuWn1BJPpirxDEo8LZJvv:ev:p0068:e01
    kind: FIGURE
    pdf_page_index: 68
    printed_page_label: "60"
    locator: "renders/1-XMC-sjwyrpWuWn1BJPpirxDEo8LZJvv/pilot-crops-300dpi/p0068_crop0_300dpi.png"
    quote: "图3-15 导轮的工作状况 a）导轮锁止（锁止+固定支撑三角） b）导轮释放（自由）"
    notes: "asset=c03s2t4-F68-1; sha256=4314ab7e3038da093540aaca436a3f9343f58182b253f1b6441392fe980615d1"
  - evidence_id: book:1-XMC-sjwyrpWuWn1BJPpirxDEo8LZJvv:ev:p0068:e02
    kind: TEXT
    pdf_page_index: 68
    printed_page_label: "60"
    locator: "text/1-XMC-sjwyrpWuWn1BJPpirxDEo8LZJvv/p0068.txt#L10-L12"
    quote: "当涡轮转速达到泵轮转速的规定比例时，导轮则按泵轮的同样方向旋转，这称之为耦合器工作点或耦合器点。在达到耦合器工作点时，不产生转矩增大效果，综合式液力变矩器的工作如同普通的液力耦合器一样。"
  - evidence_id: book:1-XMC-sjwyrpWuWn1BJPpirxDEo8LZJvv:ev:p0068:e03
    kind: TEXT
    pdf_page_index: 68
    printed_page_label: "60"
    locator: "text/1-XMC-sjwyrpWuWn1BJPpirxDEo8LZJvv/p0068.txt#L13-L22"
    quote: "3. 耦合器工作点 随着涡轮旋转速比的逐渐上升……此时转矩比大约为1∶1。因为从涡轮流出的工作液以高速冲击导轮叶片的后表面，单向离合器允许导轮按泵轮的旋转方向旋转……导轮开始转动的转速称为耦合器工作点，如图3-16所示。"
  - evidence_id: book:1-XMC-sjwyrpWuWn1BJPpirxDEo8LZJvv:ev:p0068:e04
    kind: FIGURE
    pdf_page_index: 68
    printed_page_label: "60"
    locator: "renders/1-XMC-sjwyrpWuWn1BJPpirxDEo8LZJvv/pilot-crops-300dpi/p0068_crop1_300dpi.png"
    quote: "图3-16 耦合点和失速点（横轴传动比0~1.0，左轴转矩比1~3，右轴传动效率%；变矩区/耦合区以0.85分界；失速点(0,2)、耦合器工作点(0.85,1)）"
    notes: "asset=c03s2t4-F68-2; sha256=76c372dd51b6f841cfa46f731e5b5f83a7a8090a925b67d021a3997836e379c8; 曲线估读仅记于资产观察"
  - evidence_id: book:1-XMC-sjwyrpWuWn1BJPpirxDEo8LZJvv:ev:p0068:e05
    kind: TEXT
    pdf_page_index: 68
    printed_page_label: "60"
    locator: "text/1-XMC-sjwyrpWuWn1BJPpirxDEo8LZJvv/p0068.txt#L23-L28"
    quote: "综合式液力变矩器的工作区域可分为两个，即变矩器工作区和耦合器工作区……转矩增大仅发生在变矩器工作区，在以耦合器工作点为界限的耦合器工作区内，仅有转矩的传递而无转矩的增大。所以，自动变速器车辆之所以能够平稳起步而不会引起发动机熄火……"
  - evidence_id: book:1-XMC-sjwyrpWuWn1BJPpirxDEo8LZJvv:ev:p0068:e06
    kind: TEXT
    pdf_page_index: 68
    printed_page_label: "60"
    locator: "text/1-XMC-sjwyrpWuWn1BJPpirxDEo8LZJvv/p0068.txt#L29-L35"
    quote: "4. 综合式液力变矩器的耦合器工作区……当涡轮的转速接近于泵轮的转速时，流向导轮叶片工作液的方向与来自泵轮的液流方向相同……这时，单向离合器释放，而使导轮相对于内座圈自由转动。（接 p0069：工作液的循环流动强度很弱……）"

  # ---------- p0069 (printed 61) ----------
  - evidence_id: book:1-XMC-sjwyrpWuWn1BJPpirxDEo8LZJvv:ev:p0069:e01
    kind: TEXT
    pdf_page_index: 69
    printed_page_label: "61"
    locator: "text/1-XMC-sjwyrpWuWn1BJPpirxDEo8LZJvv/p0069.txt#L4-L8"
    quote: "5. 失速点 涡轮固定不动而泵轮仍在旋转时的工况称为失速工况。失速转速是涡轮处于静止时发动机所能达到的最高转速。失速发生在汽车起步或汽车停车时。当今，大多数综合式液力变矩器的失速转速处于2000～3000r/min之间……"
  - evidence_id: book:1-XMC-sjwyrpWuWn1BJPpirxDEo8LZJvv:ev:p0069:e02
    kind: TEXT
    pdf_page_index: 69
    printed_page_label: "61"
    locator: "text/1-XMC-sjwyrpWuWn1BJPpirxDEo8LZJvv/p0069.txt#L9-L12"
    quote: "当涡轮完全不旋转（如变速杆在D位而车辆被制动时）……即综合式液力变矩器的最大转矩比是在失速点时，它通常在1.7～2.5范围之内。在失速点，工作液具有很大的能量用于克服车辆起步时的静止阻力。"
  - evidence_id: book:1-XMC-sjwyrpWuWn1BJPpirxDEo8LZJvv:ev:p0069:e03
    kind: TEXT
    pdf_page_index: 69
    printed_page_label: "61"
    locator: "text/1-XMC-sjwyrpWuWn1BJPpirxDEo8LZJvv/p0069.txt#L13-L20"
    quote: "1. 车辆静止，发动机怠速运转……2. 车辆起步阶段……"
  - evidence_id: book:1-XMC-sjwyrpWuWn1BJPpirxDEo8LZJvv:ev:p0069:e04
    kind: TEXT
    pdf_page_index: 69
    printed_page_label: "61"
    locator: "text/1-XMC-sjwyrpWuWn1BJPpirxDEo8LZJvv/p0069.txt#L20-L32"
    quote: "3. 车辆低速行驶阶段……4. 车辆以中速至高速行驶阶段……正常起步2～3s后……5. 发动机制动阶段……涡轮的转速有可能高于泵轮的转速。"
  - evidence_id: book:1-XMC-sjwyrpWuWn1BJPpirxDEo8LZJvv:ev:p0069:e05
    kind: TEXT
    pdf_page_index: 69
    printed_page_label: "61"
    locator: "text/1-XMC-sjwyrpWuWn1BJPpirxDEo8LZJvv/p0069.txt#L33-L35"
    quote: "五、综合式液力变矩器的工作特性 综合式液力变矩器的工作特性主要是转矩特性和效率特性。"

  # ---------- p0070 (printed 62) ----------
  - evidence_id: book:1-XMC-sjwyrpWuWn1BJPpirxDEo8LZJvv:ev:p0070:e01
    kind: TEXT
    pdf_page_index: 70
    printed_page_label: "62"
    locator: "text/1-XMC-sjwyrpWuWn1BJPpirxDEo8LZJvv/p0070.txt#L3-L13"
    quote: "1. 转矩特性……K = Mt / Mp = （Mp ± Ms）/ Mp……1）低转速时，K=（Mp+Ms）/Mp > 1（实际在车上为1.7～2.5之间）……2）高转速时，K = Mt / Mp = 1，说明综合式液力变矩器的变矩比等于液力耦合器。"
    notes: "含 K 表达式，与 p0063:e01 同式"
  - evidence_id: book:1-XMC-sjwyrpWuWn1BJPpirxDEo8LZJvv:ev:p0070:e02
    kind: TEXT
    pdf_page_index: 70
    printed_page_label: "62"
    locator: "text/1-XMC-sjwyrpWuWn1BJPpirxDEo8LZJvv/p0070.txt#L14-L28"
    quote: "2. 效率特性……η = Pt / Pp × 100% ……1）低转速时，K>1……传动效率大于液力耦合器。2）高转速时，K=1……传动效率等于液力耦合器。"
  - evidence_id: book:1-XMC-sjwyrpWuWn1BJPpirxDEo8LZJvv:ev:p0070:e03
    kind: TEXT
    pdf_page_index: 70
    printed_page_label: "62"
    locator: "text/1-XMC-sjwyrpWuWn1BJPpirxDEo8LZJvv/p0070.txt#L29-L38"
    quote: "综上所述……在失速点时……传动效率为零……传动效率在综合式液力变矩器达到耦合点前达到最大值……综合式液力变矩器的传动效率不可能达到100%，一般可以达到95%左右。"

  # ---------- p0071 (printed 63) ----------
  - evidence_id: book:1-XMC-sjwyrpWuWn1BJPpirxDEo8LZJvv:ev:p0071:e01
    kind: TEXT
    pdf_page_index: 71
    printed_page_label: "63"
    locator: "text/1-XMC-sjwyrpWuWn1BJPpirxDEo8LZJvv/p0071.txt#L5-L8"
    quote: "在前面三个课题中所讲述的动力传递装置都属于软连接机构……泵轮与涡轮之间的转速差最少也有4%～5%，这相当于泵轮与涡轮之间存在有滑转现象……传动效率低，无法达到100%……"
  - evidence_id: book:1-XMC-sjwyrpWuWn1BJPpirxDEo8LZJvv:ev:p0071:e02
    kind: TEXT
    pdf_page_index: 71
    printed_page_label: "63"
    locator: "text/1-XMC-sjwyrpWuWn1BJPpirxDEo8LZJvv/p0071.txt#L9-L12"
    quote: "为了提高变矩器的传动效率，减小燃油消耗，现代汽车采用的液力变矩器均为带锁止离合器的综合式液力变矩器……使用机械的方式直接连接泵轮和涡轮……使其尽可能接近100%。"
  - evidence_id: book:1-XMC-sjwyrpWuWn1BJPpirxDEo8LZJvv:ev:p0071:e03
    kind: TEXT
    pdf_page_index: 71
    printed_page_label: "63"
    locator: "text/1-XMC-sjwyrpWuWn1BJPpirxDEo8LZJvv/p0071.txt#L12-L16"
    quote: "这种变矩器的锁止离合器内有一个可轴向移动的锁止活塞，锁止活塞后侧的工作液与变矩器泵轮、涡轮中的工作液相通，保持一定的油压（该油压称为变矩器油压）；锁止活塞前侧的工作液通过自动变速器输入轴中间的控制油道与阀体上的锁止控制阀相通。锁止控制阀由速控油压或自动变速器电脑通过锁止电磁阀来控制。"
