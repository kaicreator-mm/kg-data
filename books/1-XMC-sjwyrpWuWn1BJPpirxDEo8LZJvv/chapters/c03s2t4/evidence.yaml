    notes: "asset=c03s2t4-F65-1; sha256=39c8c6cc8c1f17cc1527bea7df1b8baf5b1205e89708bd9db5db752193e2fc82"
  - evidence_id: book:1-XMC-sjwyrpWuWn1BJPpirxDEo8LZJvv:ev:p0065:e04
    kind: FIGURE
