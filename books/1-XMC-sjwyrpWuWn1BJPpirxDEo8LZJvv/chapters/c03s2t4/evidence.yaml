    printed_page_label: "52"
    locator: "text/1-XMC-sjwyrpWuWn1BJPpirxDEo8LZJvv/p0060.txt#L32-L34"
    quote: "液力变矩器在泵轮和涡轮之间加入了双向锁止导轮，从而传递和增大来自发动机的转矩……它通过螺栓固定在发动机飞轮的后端。"
  - evidence_id: book:1-XMC-sjwyrpWuWn1BJPpirxDEo8LZJvv:ev:p0060:e08
