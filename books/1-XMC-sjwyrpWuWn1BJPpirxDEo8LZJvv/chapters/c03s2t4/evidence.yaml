    locator: "text/1-XMC-sjwyrpWuWn1BJPpirxDEo8LZJvv/p0060.txt#L10-L16"
    quote: "在耦合器传递动力的过程中，存在着能量损失。油液从泵轮流至涡轮……当油液回流到泵轮时，其流动方向由于涡轮叶片的反作用，变为其与泵轮的转向相反，使发动机的运转阻力增加……这种现象称之为冲击损失"
    notes: "冲击损失定义与后果段"
  - evidence_id: book:1-XMC-sjwyrpWuWn1BJPpirxDEo8LZJvv:ev:p0060:e02
    kind: TEXT
    pdf_page_index: 60
    printed_page_label: "52"
    locator: "text/1-XMC-sjwyrpWuWn1BJPpirxDEo8LZJvv/p0060.txt#L17-L19"
    quote: "因此，耦合器的输出转矩与输入转矩的理论比值为1∶1，但耦合器的输出转矩与输入转矩始终不会相等，更不可能超出输入转矩。"
