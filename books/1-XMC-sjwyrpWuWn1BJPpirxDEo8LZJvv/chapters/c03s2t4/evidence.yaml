    quote: "泵轮和涡轮叶片的形状设计能将油液流动的扰动减小至最小……液力变矩器增加了第三个元件———双向锁止导轮，这样，液力变矩器不仅能传递发动机的动力，还能改变发动机的输出转矩。"
