    printed_page_label: "57"
    locator: "renders/1-XMC-sjwyrpWuWn1BJPpirxDEo8LZJvv/pilot-crops-300dpi/p0065_crop1_300dpi.png"
    quote: "图3-10 汽车车速较高时的工况（同布局，粗箭头示液流射向导轮叶片后部）"
    notes: "asset=c03s2t4-F65-2; sha256=16590ab5c599eae6015ee6a8af11f5e345ce9ae797d85b4940a0a0c188ef22d4"
  - evidence_id: book:1-XMC-sjwyrpWuWn1BJPpirxDEo8LZJvv:ev:p0065:e05
    kind: TEXT
    pdf_page_index: 65
    printed_page_label: "57"
    locator: "text/1-XMC-sjwyrpWuWn1BJPpirxDEo8LZJvv/p0065.txt#L25-L30"
    quote: "1）当在低速时，作用在导轮叶片前表面的液体通过单向离合器锁止使导轮固定，产生增大转矩的效果……2）当在高速时，作用在导轮叶片后表面的液体通过单向离合器的超越（释放），使导轮自由旋转……此时变矩器实际上变成了耦合器，它只能传递力矩……"
  - evidence_id: book:1-XMC-sjwyrpWuWn1BJPpirxDEo8LZJvv:ev:p0065:e06
    kind: TEXT
    pdf_page_index: 65
    printed_page_label: "57"
    locator: "text/1-XMC-sjwyrpWuWn1BJPpirxDEo8LZJvv/p0065.txt#L31-L34"
    quote: "如果单向离合器失效表现为在两个方向都能自由旋转，则反映出汽车低速时加速性能减弱；如果失效表现为两个方向都锁止，则反映出汽车高速时动力不足。自动变速器的失速试验，也可以反映变矩器中单向离合器的失效状况。"

  # ---------- p0066 (printed 58) ----------
