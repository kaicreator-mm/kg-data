id: https://example.org/parts-kg/schema/m05
name: parts_kg_m05
prefixes:
  linkml: https://w3id.org/linkml/
  parts: https://example.org/parts-kg/
default_prefix: parts
imports:
  - linkml:types
classes:
  BookModule:
    tree_root: true
    attributes:
      book_id:
        range: string
        required: true
      book_title:
        range: string
      edition:
        range: string
      module:
        range: string
      module_title:
        range: string
      mode:
        range: string
      status:
        range: string
      rights:
        range: string
      verification_status:
        range: string
      records:
        range: KnowledgeRecord
        multivalued: true
        inlined_as_list: true
  KnowledgeRecord:
    attributes:
      id:
        identifier: true
        range: string
      title:
        range: string
      kind:
        range: string
      statement:
        range: string
      technical_explanation:
        range: string
      assumptions_and_scope:
        range: string
      counterexample:
        range: string
      toc_anchor:
        range: string
      source_scope:
        range: string
      verification_status:
        range: string
      related:
        range: Relation
        multivalued: true
        inlined_as_list: true
  Relation:
    attributes:
      target:
        range: string
      relation:
        range: string
