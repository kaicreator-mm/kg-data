id: https://example.org/dke/books/linkml/knowledge-graph-0.1
name: dke_toc_knowledge_graph
prefixes:
  linkml: https://w3id.org/linkml/
  dke: https://example.org/dke/books/
  xsd: http://www.w3.org/2001/XMLSchema#
default_prefix: dke
imports:
- linkml:types
slots:
  book_id:
    range: string
    required: true
  book_title:
    range: string
  edition:
    range: string
  chapter:
    range: string
  toc_module:
    range: string
  mode:
    range: string
  baseline_doc:
    range: uri
  provenance:
    range: string
  schema_version:
    range: string
  status:
    range: string
  id:
    identifier: true
    range: string
  title:
    range: string
    required: true
  kind:
    range: string
  statement:
    range: string
    required: true
  technical_explanation:
    range: string
  assumptions_and_scope:
    range: string
  counterexample:
    range: string
  toc_anchor:
    range: string
  related:
    range: Relationship
    multivalued: true
    in_subset:
    - knowledge_graph
  target:
    range: string
  relation:
    range: string
  source_scope:
    range: string
  verification_status:
    range: string
  requires_authoritative_check:
    range: boolean
  source_evidence_for_claim:
    range: string
  generation_provenance:
    range: string
  review_status:
    range: string
  records:
    range: KnowledgeRecord
    multivalued: true
subsets:
  knowledge_graph:
    description: TOC-grounded candidate knowledge graph
classes:
  BookKnowledgeGraph:
    tree_root: true
    attributes: {}
    slots:
    - book_id
    - book_title
    - edition
    - chapter
    - toc_module
    - mode
    - baseline_doc
    - provenance
    - schema_version
    - status
    - records
  KnowledgeRecord:
    slots:
    - id
    - title
    - kind
    - statement
    - technical_explanation
    - assumptions_and_scope
    - counterexample
    - toc_anchor
    - related
    - source_scope
    - verification_status
    - requires_authoritative_check
    - source_evidence_for_claim
    - generation_provenance
    - review_status
  Relationship:
    slots:
    - target
    - relation
