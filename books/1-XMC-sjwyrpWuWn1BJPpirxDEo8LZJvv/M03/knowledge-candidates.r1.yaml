- id: M03-K003
  title: 导轮产生反力的作用机制
  kind: mechanism
  statement: 导轮在反力阶段改变涡轮回流液体的方向，使泵轮入口流动条件发生变化，从而在一定工况下增加涡轮输出转矩。
  technical_explanation: 流体角动量改变对应叶轮/导轮的转矩；导轮反力经其支承传递到壳体。
  assumptions_and_scope: 依赖导轮单向离合器处于锁止反力状态以及具体流场；不应外推到每一转速比。
  counterexample: 导轮存在并不意味着所有工况下涡轮转矩始终大于泵轮转矩。
