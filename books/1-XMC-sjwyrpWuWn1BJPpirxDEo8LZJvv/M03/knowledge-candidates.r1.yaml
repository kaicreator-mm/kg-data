- id: M03-K001
  title: 液力耦合器的两轮能量传递
  kind: mechanism
  statement: 液力耦合器通常由输入侧泵轮和输出侧涡轮构成；泵轮驱动液体循环，流体动量变化向涡轮传递转矩。
  technical_explanation: 发动机机械功经泵轮变成流体运动能量，再由涡轮恢复为轴功；损失表现为流体摩擦与发热。
  assumptions_and_scope: 必须明确泵轮/涡轮是两个不同的旋转部件；效率不是恒等于1。
  counterexample: 不能因为两轮转速接近，就推断没有任何能量损失。
  toc_anchor: 课题一 液力耦合器
