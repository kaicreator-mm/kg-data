- id: M03-K012
  title: 液力传动热损失与ATF冷却关联
  kind: energy_balance
  statement: 未锁止液力传动的输入功率与输出功率之差主要转化为热和其他损失，并通过ATF、壳体与冷却系统排散。
  technical_explanation: 持续高滑差、冷却能力不足或流量异常会提升热负荷，但实际温升还受驾驶循环、油路及环境影响。
  assumptions_and_scope: ATF类型、温度限值及冷却路径必须与具体变速器型号绑定。
  counterexample: 高ATF温度不能单凭现象唯一归因于液力变矩器打滑。
