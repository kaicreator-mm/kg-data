- id: M03-K008
  title: 锁止离合器与液力滑差的区别
  kind: comparison
  statement: 锁止离合器通过受控摩擦联接使输入和输出轴更直接地传递机械功；未锁止时液力传动存在随工况变化的速度差。
  technical_explanation: 锁止降低持续液力滑差损失，但也涉及扭转振动隔离、摩擦热和换挡品质的取舍。
  assumptions_and_scope: 部分系统允许可控微滑差，不能用简单“开/关”概括全部锁止策略。
  counterexample: 传动转速差接近零不能单独证明锁止摩擦片完好。
  toc_anchor: 课题四 带锁止离合器的综合式液力变矩器
