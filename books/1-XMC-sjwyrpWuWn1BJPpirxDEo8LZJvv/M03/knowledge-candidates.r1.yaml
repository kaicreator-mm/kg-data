- id: M03-K005
  title: 导轮单向离合器的反力与超越状态
  kind: state_machine
  statement: 典型综合式液力变矩器的导轮通过单向离合器，在需要承受特定方向液流反力时锁止，在回流反力方向转变时允许超越旋转。
  technical_explanation: 这种状态转换减少高速耦合区导轮持续阻碍流动造成的损失。
  assumptions_and_scope: 锁止/超越取决于真实反力矩方向及单向离合器机构，不存在通用于所有型号的固定车速阈值。
  counterexample: 不能仅根据车速高低就绝对断言导轮正在锁止或自由旋转。
  toc_anchor: 三、 单向离合器的结构与原理
