  title: 失速试验的安全门槛
  kind: safety_constraint
  statement: 失速试验可能造成极大热负荷和传动系负担，必须先满足车型专用的操作限制、工作温度和安全保护条件。
  technical_explanation: 在缺乏授权 OEM 程序、测试条件和设备时，知识库仅记录诊断原理，不输出可执行的试验步骤。
