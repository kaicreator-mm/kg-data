- id: M03-K006
  title: 速度比及其测量边界
  kind: formula
  statement: 液力变矩器常用涡轮转速与泵轮转速之比表征工作点：k=n_t/n_p。
  technical_explanation: 速度比仅描述两轴转速比例，需结合转矩比和效率才能讨论能量传递性能。
  assumptions_and_scope: 要求n_p≠0，转速均在同一基准和方向约定下测量；负向或反拖工况另行定义。
  counterexample: k 接近 1 不等于锁止离合器已经机械结合。
