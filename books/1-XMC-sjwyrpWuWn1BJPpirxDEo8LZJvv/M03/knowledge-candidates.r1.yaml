- id: M03-K018
  title: 锁止滑差指标的计算条件
  kind: formula
  statement: 在明确输入、输出转速的正向定义后，可用Δn=n_p−n_t描述变矩器瞬时转速差；正向驱动时也可定义s=(n_p−n_t)/n_p。
  technical_explanation: 目标滑差与实际滑差的偏差可作为控制诊断中的辅助信号，但传感器滤波与稳态/瞬态必须分开。
  assumptions_and_scope: n_p≠0，必要时考虑符号约定；纯负滑差/反拖及混动工况需另行定义。
