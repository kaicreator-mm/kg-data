- id: M03-K011
  title: 转矩比与传动效率并非同一指标
  kind: formula
  statement: 若转矩与转速定义一致、忽略测量边界以外的功率，效率可表示为η≈(T_t ω_t)/(T_p ω_p)=τk。
  technical_explanation: 转矩比大于1并不意味着输出功率大于输入功率；转速比与液力损失共同决定效率。
  assumptions_and_scope: 稳态、正向功率流且分母非零；具体辅助泵和机械损失必须定义是否计入系统边界。
  counterexample: 不能因低速时增矩就推断变矩器是“增能”装置。
