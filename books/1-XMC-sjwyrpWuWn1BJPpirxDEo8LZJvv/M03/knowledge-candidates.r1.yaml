- id: M03-K004
  title: 角动量方程用于理解叶轮转矩
  kind: formula
  statement: 在适当控制体和符号约定下，旋转流体机械的轴转矩与质量流量及进出口切向角动量通量差有关。
  technical_explanation: 简化稳态表达：T≈ṁ(r₂Vθ₂−r₁Vθ₁)；实际流场复杂时需考虑多个进出口、非定常项和损失。
  assumptions_and_scope: 稳态平均、控制体定义明确、流量与速度取一致方向；不是某型号变矩器的试验曲线。
  counterexample: 不能把该近似式直接当作任何型号液力变矩器的精确扭矩标定值。
  toc_anchor: 课题二 液力变矩器
