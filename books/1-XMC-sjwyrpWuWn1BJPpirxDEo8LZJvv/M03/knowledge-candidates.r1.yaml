- id: M03-K009
  title: 锁止控制与工况约束
  kind: control_rule
  statement: 电子控制的锁止策略可能依赖车速、负荷、温度、挡位、振动和制动请求等变量，并在允许区域内改变结合压力或目标滑差。
  technical_explanation: 控制器通常需要兼顾经济性、NVH、传动链负荷和摩擦元件保护。
  assumptions_and_scope: 具体锁止启用条件及电磁阀逻辑属于车型标定，不得从目录推导成维修阈值。
  counterexample: 不能声称“达到某个固定车速后所有汽车均会锁止”。
