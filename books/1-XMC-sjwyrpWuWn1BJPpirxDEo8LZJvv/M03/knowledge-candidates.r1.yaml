- id: M03-K017
  title: 单向离合器失效的两种不同模式
  kind: failure_mode
  statement: 导轮单向离合器若丧失承受反力的能力，低速增矩特性可能恶化；若卡滞不能超越，高速工作区的损耗与热负荷可能异常。
  technical_explanation: 两种故障模式对工况依赖不同，诊断应综合动力表现、油温与其他证据。
  assumptions_and_scope: 必须结合具体单向离合器构型及适用诊断程序；不能单凭加速无力或过热确诊。
  counterexample: “加速无力”同时也可能来自发动机、供油、离合器等多种系统。
