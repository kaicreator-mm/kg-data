- id: M03-K007
  title: 变矩器转矩比的含义
  kind: formula
  statement: 在输入和输出转矩方向及测量边界一致时，变矩器转矩比可定义为τ=T_t/T_p。
  technical_explanation: τ 随工况变化，典型低速比反力阶段可能大于1；并非任何状态下固定不变。
  assumptions_and_scope: T_p≠0且符号定义、测量工况、内部附属功耗边界明确；具体曲线必须依型号数据核验。
  counterexample: 不能把某一型号失速转矩比复制到全部自动变速器。
  toc_anchor: 四、 液力变矩器的工作特性
