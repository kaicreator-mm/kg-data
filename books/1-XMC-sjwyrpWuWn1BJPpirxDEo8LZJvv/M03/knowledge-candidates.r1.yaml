- id: M03-K010
  title: 失速状态下的转速边界
  kind: state
  statement: 典型变矩器失速试验所称失速点是涡轮转速接近零而泵轮仍由发动机驱动的工况，反映低速比区的流体反力状态。
  technical_explanation: 此时液力传动产生较高热负荷；实际测试必须受 OEM 测试时长、温度和安全条件约束。
  assumptions_and_scope: 只表达概念，不提供可直接执行的失速试验操作；特定车型试验程序需权威核验。
  counterexample: 车辆无法移动不等于其液力变矩器处于规范的试验失速状态。
