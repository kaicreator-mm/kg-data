- id: M03-K013
  title: 内部叶轮与外部传动耦合关系
  kind: component_relation
  statement: 泵轮通常连接输入驱动侧，涡轮输出至变速器输入轴，导轮通过反力机构和固定支承路径参与工作；锁止元件提供旁路机械传递路径。
  technical_explanation: 输入输出连接关系是分析无前进挡、异响与控制失效的系统边界起点。
  assumptions_and_scope: 不同车型和集成结构可能有不同部件命名、支承结构或起动机/电机布置。
