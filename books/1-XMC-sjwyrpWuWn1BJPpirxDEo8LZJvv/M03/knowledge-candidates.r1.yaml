- id: M03-K014
  title: 锁止抖动诊断必须建立候选原因集
  kind: diagnostic_logic
  statement: 锁止区域的抖动可能与摩擦系数变化、控制压力波动、扭转减振器问题、发动机失火等原因相关；应先复现实测条件再区分。
  technical_explanation: 比较目标与实际滑差、发动机燃烧稳定性、ATF状态以及异常出现的锁止控制区间可帮助提出可证伪假设。
  assumptions_and_scope: 所列原因是候选，并非对特定车的确诊；需要 OEM 诊断数据与适用安全条件。
  counterexample: 不能仅因特定车速发生抖动，就直接更换液力变矩器总成。
