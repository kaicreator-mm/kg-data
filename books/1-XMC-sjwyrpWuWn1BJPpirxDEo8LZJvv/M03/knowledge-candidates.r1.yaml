- id: M03-K002
  title: 液力耦合器与液力变矩器的结构差异
  kind: comparison
  statement: 典型液力变矩器除泵轮和涡轮外还设导轮，导轮通过改变回流方向参与转矩反力；单纯液力耦合器不具备相同的增矩机构。
  technical_explanation: 导轮对工作液体角动量的调节改变了泵轮与涡轮之间的转矩平衡关系。
  assumptions_and_scope: 仅针对常见汽车液力变矩器结构；不能仅凭总成外观判断内部构型。
  counterexample: 不可认为所有有液体传动的设备都必然能够在低速时增矩。
