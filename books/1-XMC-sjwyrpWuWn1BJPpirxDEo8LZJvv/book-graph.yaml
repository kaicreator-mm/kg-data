  statement: 冲击损失发生于液力耦合器传递动力的过程中：油液回流到泵轮时因涡轮叶片的反作用，流动方向变为与泵轮转向相反；油液以多种方向回跳和散射以致流动受扰动，这种现象称为冲击损失。
  conditions:
  - 液力耦合器传递动力过程中
