  predicate: operating_characteristic
  statement: 液力耦合器驱动车辆行驶时，涡轮转速始终低于泵轮转速；如果泵轮和涡轮的转速相同，借助油液传递动力的过程就会停止。
  conditions:
  - 驱动车辆行驶时
