id: https://example.org/kg/lane4/m03/r2
name: lane4_m03_r2
prefixes:
  linkml: https://w3id.org/linkml/
  kg: https://example.org/kg/
default_prefix: kg
imports:
  - linkml:types
classes:
  KnowledgeRecord:
    attributes:
      id: {range: string, identifier: true, required: true}
      toc_topic_number: {range: integer, required: true}
      title: {range: string, required: true}
      kind: {range: string, required: true}
      mechanism: {range: string, required: true}
      applicability: {range: string, required: true}
      counterexample: {range: string, required: true}
      limitations: {range: string, required: true}
      assumptions: {range: string, required: true}
      source_scope: {range: string, required: true}
      toc_anchor: {range: string, required: true}
      generated_by: {range: string, required: true}
      verification_status: {range: string, required: true}
      related_ids: {range: string, multivalued: true}
