  value: null
  statement: 当电子调节器安装在交流发电机上组成整体式交流发电机时，调节器一般采用多功能集成电路（IC）调节器；整体式交流发电机电源系统的显著特点是交流发电机与 IC 调节器之间无需再使用导线连接，电源系统线路大大简化、故障率大大降低；但一旦电源系统发生故障，不能就车诊断出故障发生在交流发电机还是电子调节器，需要更换整体式交流发电机才能继续行驶。
