  - id: "M01-K002"
    title: "驱动形式与车辆牵引极限的关系"
    toc_anchor: "第1章 1.1 整车布局形式"
    claim: "驱动轮可利用的纵向牵引力受到轮胎与路面附着、法向载荷和横向力需求共同约束；四驱不等于在任何条件下都具有更短制动距离。"
    mechanism: "驱动扭矩分配影响各驱动轮的纵向力需求；轮胎附着能力有上限，制动距离还受轮胎、ABS、路面与车辆状态控制。"
    applicability: "一般轮胎-路面力学定性解释；不提供固定附着系数或车型性能数值。"
    counterexample: "冰面上四驱车仍可能因轮胎附着不足而无法有效制动。"
    provenance: "LLM_ORIGINAL_FROM_TOC_TOPIC_NOT_BOOK_BODY"
