  - id: "M01-K001"
    title: "驱动轮与发动机安装位置是两个独立维度"
    toc_anchor: "第1章 1.1 整车布局形式"
    claim: "前置、后置和中置描述动力总成相对车身的位置；前驱、后驱和四驱描述动力分配到哪些车轮，两者不能互相代替。"
    mechanism: "动力源经变速器、传动轴或半轴、差速器和驱动轮形成传力路径；发动机纵置或横置影响布置，但不唯一决定驱动轴。"
    applicability: "主要讨论传统机械传动乘用车；电驱动桥和多电机系统需重新定义动力源位置。"
    counterexample: "前置发动机并不必然是前轮驱动，前置后驱和前置四驱均可成立。"
    provenance: "LLM_ORIGINAL_FROM_TOC_TOPIC_NOT_BOOK_BODY"
