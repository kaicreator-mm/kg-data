  - id: "M01-K003"
    title: "横置与纵置不等于驱动形式"
    toc_anchor: "第1章 1.1 整车布局形式"
    claim: "动力总成的横置或纵置是曲轴轴线相对车身纵向的空间关系，不是前后轮驱动的直接判据。"
    mechanism: "变速驱动桥、分动器及差速器可改变动力传递方向，空间布置与动力输出路径需分别确认。"
    applicability: "以内燃机曲轴轴线定义；增程器、轮毂电机或多动力源车型须另设判据。"
    counterexample: "不能仅从发动机横置推断车辆一定没有后轴驱动力。"
    provenance: "LLM_ORIGINAL_FROM_TOC_TOPIC_NOT_BOOK_BODY"
