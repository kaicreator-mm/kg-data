  - id: "M01-K004"
    title: "整车主要子系统的功能边界"
    toc_anchor: "第1章 1.2 整车基本构造"
    claim: "整车可从动力与能量、传动与行驶、转向制动、车身结构、电子控制等功能维度分析，但部件数不是跨车型固定常数。"
    mechanism: "能量产生或储存、扭矩转换、轮地力形成、姿态控制与乘员保护存在跨系统依赖，诊断需沿能量流和信号流建立边界。"
    applicability: "功能分解而非原书精确零件清单；不同混动及纯电平台可能改变物理模块划分。"
    counterexample: "不能把传统燃油车的发动机和变速器清单原样套用到纯电动车。"
