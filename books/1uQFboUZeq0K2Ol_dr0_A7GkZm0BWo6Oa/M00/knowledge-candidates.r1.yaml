  - id: BODYEC-K002
    title: "开关信号的接触抖动与软件去抖"
    mechanism: "机械触点在闭合或断开过程中可能短时重复接通与断开，采样系统若直接响应每次跳变会出现多次触发。"
    explanation: "去抖可通过时间窗口、稳定计数或状态机实现，窗口大小应兼顾误触发抑制与响应延迟。"
    applicability: "适用于存在机械接点的车身控制输入；不能推定某车的采样周期或去抖阈值。"
    counterexample: "快速重复输入也可能是人为操作或线束间歇性故障，不能一概判为触点抖动。"
    toc_anchor: null
    source_topic: "汽车车身电控系统维修入门（书名主题，非实际目录）"
