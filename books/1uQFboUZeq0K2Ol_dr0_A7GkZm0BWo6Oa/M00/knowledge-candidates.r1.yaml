records:
  - id: BODYEC-K001
    title: "车身控制器输入的上拉与接地判别"
    mechanism: "车身控制器的开关量输入可通过上拉电阻及接地开关形成电压分压；开关断开时输入接近上拉电源，闭合时接近地电位。"
    explanation: "输入端状态取决于控制器输入阻抗、上拉源、电缆电阻及接触电阻。诊断时应区分实际电压、逻辑取反与控制器软件去抖。"
    applicability: "仅适用于采用接地有效且具有上拉的数字开关输入；其他拓扑需重新建模。"
    counterexample: "不能因为测得高电平就断言开关损坏，开关断开可能正是正常状态。"
    toc_anchor: null
    source_topic: "汽车车身电控系统维修入门（书名主题，非实际目录）"
