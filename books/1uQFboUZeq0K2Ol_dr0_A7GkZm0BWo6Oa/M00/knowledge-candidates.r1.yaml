  - id: BODYEC-K003
    title: "车身控制信号的电气诊断边界"
    mechanism: "开路、对地短路、对电源短路及高接触电阻可能导致相似的逻辑症状，但在受控负载下电压与电流响应不同。"
    explanation: "应将传感器或开关、线束、供电、接地及控制器输入电路作为不同故障候选，先验证测量条件再缩小范围。"
    applicability: "仅用于低压车身电控概念分析；不提供带电跨接、短接或具体车型维修操作。"
    counterexample: "某输入持续为低电平并不能单独证明线束对地短路，也可能是开关正常闭合或控制器内部故障。"
    toc_anchor: null
