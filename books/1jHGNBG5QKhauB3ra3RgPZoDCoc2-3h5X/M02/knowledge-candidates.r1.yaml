    title: "轮胎纵向力与附着上限"
    toc_anchor: "第2章 / 2.2 轮胎—路面接触力 / 2.2.1 摩擦模型"
    mechanism: "纵向接触力可在简化模型中写成 Fx≈μ(λ,工况)Fz，μ 随滑移、路面、胎温、法向载荷等变化。轮胎附着峰值的位置并非全路面固定常数。"
    applicability_assumptions: "只作宏观集中参数模型；实际轮胎具有组合滑移、载荷敏感性和滞后，μ 不能直接当作已知的实时传感器读数。"
    counterexample: "不能声称所有湿滑路面最优滑移率固定为某百分比，或以单次减速度唯一反推出摩擦系数。"
