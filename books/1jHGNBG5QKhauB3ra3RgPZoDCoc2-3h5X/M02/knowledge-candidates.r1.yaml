    title: "轮端旋转动力学与可观测性"
    toc_anchor: "第2章 / 2.3 单轴模型"
    mechanism: "在选定正向角速度符号下，简化车轮转动方程 J dω/dt=R Fx−Tb，其中 J 为等效转动惯量，Tb 为制动阻力矩。通过轮速变化可约束接触力和制动矩的组合，但通常不能单独辨识二者。"
    applicability_assumptions: "等效半径、惯量及正负号约定已声明，忽略或另行建模轴承阻力、驱动扭矩与耦合效应；仅为教学研究简化式。"
    counterexample: "轮速突然下降不一定意味着路面摩擦骤降，也可能由制动矩变化、传感器错误或轮径变化造成。"
