  - id: AB-M02-K004
    title: "纵向车身动力学与单轴模型边界"
    toc_anchor: "第2章 / 2.3 单轴模型 / 2.4 双轴模型"
    mechanism: "简化直线运动满足 m dv/dt≈ΣFx−Fres，前后轴法向载荷会随制动减速度及质心几何变化。单轴等效模型可研究基本滑移反馈，却无法直接代表各轮不同附着和左右不对称。"
    applicability_assumptions: "平直路面、车体近似刚体、符号统一；坡度、空气阻力、侧向力、载荷转移和多轮差异须在应用时补充。"
    counterexample: "不能把单轮模型稳定性结论直接当作分离附着路面整车横摆稳定性证明。"
