    mechanism: "制动时轮胎接触区周向速度 Rω 与车辆纵向速度 v 的差异构成滑移；常见正向制动定义 λ=(v−Rω)/v。该量无量纲，反映轮胎纵向相对运动而非轮速传感器的绝对误差。"
    applicability_assumptions: "车辆前进、v>0、有效滚动半径R定义一致；近零车速须采用保护分母或切换估计状态，轮胎动态半径与标定误差需单独处理。"
    counterexample: "不能在 v=0 时直接除以 v；不能把负滑移的驱动工况按相同符号直接解释为制动抱死。"
