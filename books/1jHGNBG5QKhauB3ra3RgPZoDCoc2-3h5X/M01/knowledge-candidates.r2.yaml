  - id: AB-M01-K006
    title: "制动滑移反馈的车速估计依赖"
    toc_anchor: "第1章 / 1.5"
    mechanism: "滑移率需要车轮角速度和纵向车速估计；纯轮速在四轮同时大滑移时可能失去可靠车速基准，IMU积分又会受偏置和坡度误差影响。"
    applicability_assumptions: "车辆前进且传感器时间同步；低速阶段采用专门的估计有效性判据。"
    counterexample: "以所有轮速最小值当作车速，在急制动时可能严重低估车速。"
    uncertainty: "需权威技术来源与具体车型约束独立核验；不可用于维修安全决策"
    verification_status: MODEL_GENERATED_UNVERIFIED
