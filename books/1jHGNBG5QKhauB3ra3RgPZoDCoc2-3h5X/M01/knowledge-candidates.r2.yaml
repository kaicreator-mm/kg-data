        target: AB-M01-K008
  - id: AB-M01-K008
    title: "集成底盘控制的多目标冲突"
    toc_anchor: "第1章 / 1.6"
    mechanism: "横摆稳定、纵向减速、转向响应和舒适性可能同时竞争轮胎摩擦圆与执行器能力；上层目标分配需优先约束安全可行域，再对多个控制器的请求仲裁。"
    applicability_assumptions: "假定可观测的车辆状态与可用轮胎力边界，摩擦估计不确定性需保守处理。"
    counterexample: "直接相加独立制动与转向控制命令，可能使轮胎组合力需求超过附着极限。"
    uncertainty: "需权威技术来源与具体车型约束独立核验；不可用于维修安全决策"
    verification_status: MODEL_GENERATED_UNVERIFIED
