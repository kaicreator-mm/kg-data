        target: AB-M01-K010
  - id: AB-M01-K010
    title: "制动控制的安全验证分层"
    toc_anchor: "第1章 / 1.4/1.6"
    mechanism: "模型层验证稳定性与边界，软件层执行故障注入、时间戳和状态机测试，硬件在环验证通信延迟和执行器饱和，整车试验才可观察复杂路面及车辆耦合。"
    applicability_assumptions: "任何实车制动测试均需合法受控试验条件和独立安全规程；这里不提供实际危险操作步骤。"
    counterexample: "仿真中滑移跟踪误差较小不能证明故障降级、功能安全或实车制动距离满足要求。"
    uncertainty: "需权威技术来源与具体车型约束独立核验；不可用于维修安全决策"
    verification_status: MODEL_GENERATED_UNVERIFIED
