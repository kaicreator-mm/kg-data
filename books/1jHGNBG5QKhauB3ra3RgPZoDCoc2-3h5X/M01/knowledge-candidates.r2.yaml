  - id: AB-M01-K001
    title: "液压调压与开关阀的控制差异"
    toc_anchor: "第1章 / 1.3"
    mechanism: "液压开关阀常用增压、保压、减压离散状态实现平均压力控制，连续比例阀可直接调节目标压力或流量，但执行器的死区、滞后和供压约束决定实际闭环带宽。"
    applicability_assumptions: "制动管路充液、泵及蓄压器能力已知；离散阀切换需要考虑采样周期与液压延迟。"
    counterexample: "把阀线圈通断等同于轮端瞬时制动力变化，会忽略压力动态和摩擦非线性。"
    uncertainty: "需权威技术来源与具体车型约束独立核验；不可用于维修安全决策"
    verification_status: MODEL_GENERATED_UNVERIFIED
