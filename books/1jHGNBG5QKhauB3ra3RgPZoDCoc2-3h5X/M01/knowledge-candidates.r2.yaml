  - id: AB-M01-K002
    title: "电液制动的能量与故障降级边界"
    toc_anchor: "第1章 / 1.3"
    mechanism: "电子液压制动将驾驶请求转换为电控液压压力目标；其安全设计需要把主电源、压力源、阀、传感器与机械或液压后备路径视为独立故障域。"
    applicability_assumptions: "降级路径仅按具体车辆架构和安全分析确定，不默认所有EHB具备同样后备制动。"
    counterexample: "电控失效并不自动等于完全无制动，也不能保证任何架构在失电后维持原有性能。"
    uncertainty: "需权威技术来源与具体车型约束独立核验；不可用于维修安全决策"
    verification_status: MODEL_GENERATED_UNVERIFIED
    related:
      - type: CONSTRAINS
        target: AB-M01-K003
  - id: AB-M01-K003
    title: "EMB 夹紧力与制动转矩的非线性关系"
    toc_anchor: "第1章 / 1.3"
    mechanism: "电机驱动减速器与丝杠产生轴向夹紧力，制动转矩还依赖有效摩擦半径、摩擦系数及两侧摩擦片状态；间隙闭合前位置运动不能等同于夹紧力。"
    applicability_assumptions: "假定机械传动完好、转矩符号和夹紧力定义一致；热衰退与磨损需单独建模。"
    counterexample: "只根据电机电流乘固定常数预测轮端转矩，可能忽略传动效率、静摩擦及盘片温度。"
    uncertainty: "需权威技术来源与具体车型约束独立核验；不可用于维修安全决策"
    verification_status: MODEL_GENERATED_UNVERIFIED
    related:
      - type: RELATED
        target: AB-M01-K004
  - id: AB-M01-K004
    title: "制动执行器双环控制与模式切换"
    toc_anchor: "第1章 / 1.3"
    mechanism: "内层电流或转矩回路抑制电机电气动态，外层位置回路可管理制动间隙，接触后切换为夹紧力控制；切换应考虑传感器噪声、迟滞和抗积分饱和。"
    applicability_assumptions: "接触检测有可信的力或位移信息，模式切换策略经过实际标定和稳定性验证。"
    counterexample: "以首次非零力读数作为无迟滞硬切换条件，噪声可使控制器反复抖动。"
    uncertainty: "需权威技术来源与具体车型约束独立核验；不可用于维修安全决策"
    verification_status: MODEL_GENERATED_UNVERIFIED
