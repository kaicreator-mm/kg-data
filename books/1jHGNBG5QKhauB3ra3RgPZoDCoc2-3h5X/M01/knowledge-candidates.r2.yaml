        target: AB-M01-K012
  - id: AB-M01-K012
    title: "再生与摩擦制动协调的条件"
    toc_anchor: "第1章 / 1.6"
    mechanism: "电驱动系统可回收部分负扭矩需求，但电池SOC、温度、电机转速和附着约束会改变可回收能力；协调器应将不可回收部分交由摩擦制动且控制减速度连续性。"
    applicability_assumptions: "仅作为电驱车的扩展研究主题，不断言该书具体控制方案或所有车辆具备再生制动。"
    counterexample: "电池满电或低温时沿用固定再生比例可能造成目标减速度偏差。"
    uncertainty: "需权威技术来源与具体车型约束独立核验；不可用于维修安全决策"
    verification_status: MODEL_GENERATED_UNVERIFIED
