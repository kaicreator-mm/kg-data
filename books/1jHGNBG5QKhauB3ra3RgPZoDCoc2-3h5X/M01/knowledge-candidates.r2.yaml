        target: AB-M01-K009
  - id: AB-M01-K009
    title: "控制目标可行性与执行器饱和"
    toc_anchor: "第1章 / 1.6"
    mechanism: "轮端制动力矩存在最大值、最小值、变化率及延迟限制，外层滑移或横摆目标必须通过可行性检查和抗积分饱和避免持续积累不可实现的控制请求。"
    applicability_assumptions: "限制取决于当前温度、电源、液压或电机状态，不可引用书中示例值为所有车型标定。"
    counterexample: "把理论控制器无约束收敛结论直接移植到饱和执行器会失效。"
    uncertainty: "需权威技术来源与具体车型约束独立核验；不可用于维修安全决策"
    verification_status: MODEL_GENERATED_UNVERIFIED
    related:
