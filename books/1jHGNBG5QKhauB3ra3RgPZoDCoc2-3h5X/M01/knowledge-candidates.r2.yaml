        target: AB-M01-K005
  - id: AB-M01-K005
    title: "线控制动命令链的端到端安全"
    toc_anchor: "第1章 / 1.4"
    mechanism: "踏板意图采集、通信、制动控制器、执行器和轮端反馈构成闭环命令链；需要对数据新鲜度、超时、失序、冗余通道一致性和执行器反馈进行独立诊断。"
    applicability_assumptions: "只提出安全分析候选，不推断某OEM已实现双通道或满足特定ASIL。"
    counterexample: "两个通道共用同一供电或同一错误算法时，简单复制并不能抵抗共因失效。"
    uncertainty: "需权威技术来源与具体车型约束独立核验；不可用于维修安全决策"
    verification_status: MODEL_GENERATED_UNVERIFIED
