        target: AB-M01-K011
  - id: AB-M01-K011
    title: "电控制动诊断中的故障可辨识性"
    toc_anchor: "第1章 / 1.2/1.3"
    mechanism: "轮速、液压压力、电机电流、夹紧力等残差可用于故障检测，但不同故障可能产生相同观测，需要多传感器激励与故障树排除不可辨识情形。"
    applicability_assumptions: "故障残差阈值应考虑正常工况噪声、热漂移和执行器时延。"
    counterexample: "压力跟踪误差单独出现不能唯一判定为阀卡滞，也可能是供压不足或传感器偏置。"
    uncertainty: "需权威技术来源与具体车型约束独立核验；不可用于维修安全决策"
    verification_status: MODEL_GENERATED_UNVERIFIED
