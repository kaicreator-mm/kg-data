  - id: AB-M01-K007
    title: "ABS减速度门限的工况敏感性"
    toc_anchor: "第1章 / 1.5"
    mechanism: "基于轮减速度的门限逻辑可快速发现趋向抱死的趋势，但轮胎路面附着、轮胎惯量、制动扭矩和传感器噪声都会改变相同门限的物理含义。"
    applicability_assumptions: "门限是待标定的控制参数而非通用常数；使用滤波需量化相位延迟。"
    counterexample: "同一减速度门限在干燥沥青和低附着路面上不保证相同稳定性。"
    uncertainty: "需权威技术来源与具体车型约束独立核验；不可用于维修安全决策"
    verification_status: MODEL_GENERATED_UNVERIFIED
