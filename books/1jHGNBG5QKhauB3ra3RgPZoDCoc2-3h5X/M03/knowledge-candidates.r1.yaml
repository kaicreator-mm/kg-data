      "title": "线性化滑移控制的局部有效域",
      "toc_anchor": "第3章/3.4",
      "mechanism": "围绕平衡滑移点线性化得到的状态空间增益依赖轮胎力曲线局部斜率；坡度、路面切换或轮胎温度变化会使名义线性模型失配。",
      "applicability_assumptions": "平衡点存在且局部导数可估",
      "counterexample": "跨越摩擦峰值后仍沿用同一线性反馈可能失稳",
