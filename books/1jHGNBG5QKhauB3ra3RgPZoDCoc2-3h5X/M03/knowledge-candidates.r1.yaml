      "title": "滑移闭环的参考目标可行性",
      "toc_anchor": "第3章/3.2",
      "mechanism": "轮速与车速估计形成滑移反馈；参考目标应受附着估计、执行器压力斜率与低速状态限制，否则跟踪误差并不代表控制器缺陷。",
      "applicability_assumptions": "直线制动、车速估计可信、执行器反馈可用",
      "counterexample": "低速时直接追踪固定滑移目标会放大估计噪声",
