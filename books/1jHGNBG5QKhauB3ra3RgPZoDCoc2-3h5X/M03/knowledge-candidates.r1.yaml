      "toc_anchor": "第3章/3.3",
      "mechanism": "轮减速度由轮速差分获得，容易受到编码量化和滤波时延影响；它不需要显式车速却不能单独确定路面附着峰值。",
      "applicability_assumptions": "轮速采样周期与滤波延迟已建模",
      "counterexample": "减速度门限触发并不证明轮胎处于最佳附着状态",
