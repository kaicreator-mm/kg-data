id: https://example.org/automotive-nvh
name: automotive_nvh_candidate
prefixes:
  linkml: https://w3id.org/linkml/
  nvh: https://example.org/automotive-nvh/
default_prefix: nvh
imports: [linkml:types]
classes:
  KnowledgeRecord:
    attributes:
      id: {range: string, identifier: true, required: true}
      title: {range: string, required: true}
      claim: {range: string, required: true}
      mechanism: {range: string}
      assumptions: {range: string}
      counterexample: {range: string}
      source_scope: {range: string}
      verification_status: {range: string}
      relations: {range: Relation, multivalued: true}
  Relation:
    attributes:
      predicate: {range: string}
      target: {range: string}
