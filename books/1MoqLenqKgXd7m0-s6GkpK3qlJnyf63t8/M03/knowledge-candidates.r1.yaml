  -
    id: "M03-K002"
    title: "起动噪声的短时评价与事件窗口"
    anchor: "起动时发动机噪声"
    claim: "起动过程的最大声压、短时响度和持续时间描述不同感知维度；单一全程等效声级可能稀释短暂冲击。"
    mechanism: "以转速和点火事件定义起动窗口，计算短时声压级、峰值、事件持续时间及重复性，并保留原始波形。"
    assumptions: "麦克风动态范围、时间加权与背景噪声需标明；主观音质需另行评价。"
    counterexample: "两车全程LAeq相同并不说明起动冲击或尖锐感相同。"
    applicability: "汽车发动机起动NVH工程研究，动力架构差异需单独判断"
