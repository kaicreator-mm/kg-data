  -
    id: "M03-K003"
    title: "发动机起动声源路径与车内响应"
    anchor: "发动机噪声对整车噪声的贡献"
    claim: "机舱声源经空气路径、结构路径和车身密封件耦合到车内；外部近场声压不能直接等同乘员耳旁声压。"
    mechanism: "在机舱、车身连接和乘员耳旁设置同步测点，结合隔声、结构传递和运行工况对比建立候选路径。"
    assumptions: "测点和车身状态、门窗密封、机舱罩、空调鼓风机状态需一致。"
    counterexample: "机舱噪声较高的车辆未必有更高车内起动声压，隔声路径可能不同。"
    applicability: "汽车发动机起动NVH工程研究，动力架构差异需单独判断"
    limitations: "目录主题研究候选，未从正文验证；OEM具体标准与阈值UNKNOWN"
