    id: "M03-K004"
    title: "半阶次分量的转速基准与识别限制"
    anchor: "发动机音质中的半阶次振动"
    claim: "相对于曲轴一转定义的阶次谱可包含非整数阶次，某些交替循环激励可能形成半阶次；半阶次峰不能唯一定位曲轴弯曲或转矩变化。"
    mechanism: "用可信转速同步阶次跟踪，检查多个转速和负荷条件下半阶次幅值及与扭振、缸体振动的相关性。"
    assumptions: "阶次定义与转速传感器脉冲数需明确，低转速快速扫频时阶次泄漏须评估。"
    counterexample: "出现0.5阶峰不必然证明曲轴弯曲故障；采样同步误差也可制造假谱线。"
    applicability: "汽车发动机起动NVH工程研究，动力架构差异需单独判断"
    limitations: "目录主题研究候选，未从正文验证；OEM具体标准与阈值UNKNOWN"
