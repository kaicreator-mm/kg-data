    id: "M03-K001"
    title: "起动燃烧噪声与机械噪声的区分"
    anchor: "起动时发动机噪声"
    claim: "燃烧压力上升激励缸体辐射，起动机啮合、齿轮和附件也可能产生机械噪声，单测点声压不足以区分。"
    mechanism: "同步采集曲轴转速、缸体振动、近场声压及允许的控制状态信号；对照拖转与首次燃烧的时序及阶次。"
    assumptions: "声学环境、发动机温度、附件状态和测点必须可比。"
    counterexample: "首次点火附近的高声压峰不一定全部是燃烧噪声，起动机脱开也可能同期发生。"
    applicability: "汽车发动机起动NVH工程研究，动力架构差异需单独判断"
    limitations: "目录主题研究候选，未从正文验证；OEM具体标准与阈值UNKNOWN"
