    id: "M03-K007"
    title: "曲轴扭转激励与车身声振路径"
    anchor: "转矩变动引起的半阶次振动"
    claim: "周期转矩不均匀可能激发轴系扭转和悬置反力，经结构路径产生车内声振；声压峰值与扭转阶次相关不等于因果成立。"
    mechanism: "同步比较曲轴角速度波动、动力总成振动、车身连接点和车内声压，在安全工程条件下进行源路径响应试验。"
    assumptions: "转矩测量和控制策略依赖车辆平台，需考虑非线性、阻尼及测量带宽。"
    counterexample: "只因某声压阶次随转速升高，就认定曲轴扭振是唯一激励源不成立。"
