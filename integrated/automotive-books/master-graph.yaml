  label: 综合式液力变矩器
  kind: assembly
  attributes_json: '{"brief": "导轮通过单向离合器支承在固定导轮支撑套上的液力变矩器，工作区域分为变矩器工作区与耦合器工作区", "pages": [63, 64, 65, 66, 67, 68, 69, 70]}'
- id: book:1-XMC-sjwyrpWuWn1BJPpirxDEo8LZJvv:ent:k04
