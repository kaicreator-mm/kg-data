  id: book:1-XMC-sjwyrpWuWn1BJPpirxDEo8LZJvv:ent:k02
  label: 液力变矩器（基本型，双向锁止导轮式）
  kind: assembly
  attributes_json: '{"brief": "在泵轮和涡轮之间加入双向锁止导轮从而能增大转矩的液力传动装置；高速时减矩，本书判定不适合实际使用", "pages": [60, 61, 62, 63]}'
